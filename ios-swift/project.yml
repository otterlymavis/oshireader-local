name: OshiReader
options:
  bundleIdPrefix: com.otterlymavis
configs:
  Debug: debug
  Staging: release
  Release: release
targets:
  OshiReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReader
    dependencies:
      - target: OshiReaderWidgetExtension
        embed: true
      - target: OshiReaderShareExtension
        embed: true
      - target: OshiReaderNotificationService
        embed: true
      - target: OshiReaderNotificationContent
        embed: true
    settings:
      base:
        INFOPLIST_FILE: OshiReader/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader
        PRODUCT_NAME: OshiReader
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OshiReader/OshiReader.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        PUSH_SUBSCRIPTION_PRODUCT_IDS: ""
        APNS_ENVIRONMENT: development
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"
        # Always emit a dSYM so any archive can be uploaded for crash symbolication.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      configs:
        Staging:
          APNS_ENVIRONMENT: production
        Release:
          APNS_ENVIRONMENT: production
  OshiReaderWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderWidget
      - path: OshiReader/Models.swift
      - path: OshiReader/PlatformRegistry.swift
      - path: OshiReader/AppLogger.swift
      - path: OshiReader/AppGroup.swift
      - path: OshiReader/ExtensionStrings.swift
      - path: OshiReader/WidgetSnapshot.swift
    settings:
      base:
        INFOPLIST_FILE: OshiReaderWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.widget
        PRODUCT_NAME: OshiReaderWidgetExtension
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OshiReaderWidget/OshiReaderWidget.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  OshiReaderShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderShare
      - path: OshiReader/AppGroup.swift
      - path: OshiReader/ExtensionStrings.swift
      - path: OshiReader/PendingShare.swift
    settings:
      base:
        INFOPLIST_FILE: OshiReaderShare/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.share
        PRODUCT_NAME: OshiReaderShareExtension
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OshiReaderShare/OshiReaderShare.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  OshiReaderNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderNotificationService
    dependencies:
      - sdk: UserNotifications.framework
    settings:
      base:
        INFOPLIST_FILE: OshiReaderNotificationService/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.NotificationService
        PRODUCT_NAME: OshiReaderNotificationService
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  OshiReaderNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderNotificationContent
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        INFOPLIST_FILE: OshiReaderNotificationContent/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.NotificationContent
        PRODUCT_NAME: OshiReaderNotificationContent
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  OshiReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderTests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
  OshiReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderUITests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otterlymavis.OshiReaderUITests
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic

schemes:
  OshiReader:
    build:
      targets:
        OshiReader: [run, test, profile, analyze, archive]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Debug
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  OshiReader Unit Tests:
    build:
      targets:
        OshiReader: [test]
    test:
      targets:
        - OshiReaderTests
      config: Debug
  OshiReader Local:
    build:
      targets:
        OshiReader: [run, test, profile, analyze, archive]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Debug
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
  OshiReader Staging:
    build:
      targets:
        OshiReader: [run, test, profile, analyze, archive]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Staging
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
  OshiReader Production:
    build:
      targets:
        OshiReader: [run, test, profile, analyze, archive]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Release
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
