name: OshiReader Local paid-backend release gate

on:
  workflow_dispatch:
    inputs:
      catalog_mode:
        description: "Whether paid products are enabled for this candidate"
        required: true
        type: choice
        options:
          - disabled
          - enabled
      product_ids:
        description: "Approved monthly,yearly,lifetime StoreKit IDs in that order; required only when catalog_mode is enabled"
        required: false
        type: string
      physical_push_test:
        description: "Sandbox purchase, hosted-feed, and terminated-app push acceptance"
        required: true
        type: choice
        options:
          - not-required
          - pending
          - passed
      receipt_reporting_test:
        description: "Physical-device notification-service receipt reporting acceptance"
        required: true
        type: choice
        options:
          - not-required
          - pending
          - passed
      sandbox_billing_matrix:
        description: "Sandbox purchase/restore, monthly/yearly switching, lifetime coexistence/fallback, expiry, and refund/revocation acceptance"
        required: true
        type: choice
        options:
          - not-required
          - pending
          - passed
      paid_client_matrix:
        description: "Hosted feed/status, muting, notification controls, recovery, expiry/renewal, and opt-in diagnostics acceptance"
        required: true
        type: choice
        options:
          - not-required
          - pending
          - passed
      acceptance_evidence:
        description: "TestFlight build and dated device/sandbox acceptance record; required when enabled"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog decision and Local configuration
        env:
          CATALOG_MODE: ${{ inputs.catalog_mode }}
          PRODUCT_IDS: ${{ inputs.product_ids }}
          PHYSICAL_PUSH_TEST: ${{ inputs.physical_push_test }}
          RECEIPT_REPORTING_TEST: ${{ inputs.receipt_reporting_test }}
          SANDBOX_BILLING_MATRIX: ${{ inputs.sandbox_billing_matrix }}
          PAID_CLIENT_MATRIX: ${{ inputs.paid_client_matrix }}
          ACCEPTANCE_EVIDENCE: ${{ inputs.acceptance_evidence }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          project = Path("ios-swift/project.yml").read_text(encoding="utf-8")
          catalog = json.loads(Path("ios-swift/config/paid-catalog.json").read_text(encoding="utf-8"))
          info = Path("ios-swift/OshiReader/Info.plist").read_text(encoding="utf-8")
          entitlements = Path("ios-swift/OshiReader/OshiReader.entitlements").read_text(encoding="utf-8")
          privacy = Path("ios-swift/OshiReader/PrivacyInfo.xcprivacy").read_text(encoding="utf-8")
          content_info = Path("ios-swift/OshiReaderNotificationContent/Info.plist").read_text(encoding="utf-8")
          app_delegate = Path("ios-swift/OshiReader/AppDelegate.swift").read_text(encoding="utf-8")
          backend_client = Path("ios-swift/OshiReader/BackendClient.swift").read_text(encoding="utf-8")
          paid_backend = Path("ios-swift/OshiReader/PaidBackendFeedCoordinator.swift").read_text(encoding="utf-8")
          plus_store = Path("ios-swift/OshiReader/PlusStore.swift").read_text(encoding="utf-8")
          settings_view = Path("ios-swift/OshiReader/Views/SettingsView.swift").read_text(encoding="utf-8")
          fastfile = Path("ios-swift/fastlane/Fastfile").read_text(encoding="utf-8")
          checks = {
              "Local bundle identifier": "PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader" in project,
              "catalog build setting": (
                  'PUSH_SUBSCRIPTION_PRODUCT_IDS: "com.otterpia.oshireader.hosted.monthly,'
                  'com.otterpia.oshireader.hosted.yearly,'
                  'com.otterpia.oshireader.hosted.lifetime"'
              ) in project,
              "approved catalog is enabled by default": catalog.get("repository_default_enabled") is True,
              "single hosted subscription group": catalog.get("subscription_group") == "OshiReader Hosted",
              "approved catalog has the exact monthly/yearly/lifetime products": [
                  (
                      product.get("id"),
                      product.get("type"),
                      product.get("duration"),
                      product.get("push_term_limit"),
                  )
                  for product in catalog.get("products", [])
              ] == [
                  ("com.otterpia.oshireader.hosted.monthly", "auto_renewable", "monthly", 10),
                  ("com.otterpia.oshireader.hosted.yearly", "auto_renewable", "yearly", 10),
                  ("com.otterpia.oshireader.hosted.lifetime", "non_consumable", "lifetime", 1),
              ],
              "catalog Info.plist binding": "$(PUSH_SUBSCRIPTION_PRODUCT_IDS)" in info,
              "APNs environment Info.plist binding": all(value in info for value in (
                  "OshiReaderAPNSEnvironment",
                  "$(APNS_ENVIRONMENT)",
              )),
              "APNs entitlement": "$(APNS_ENVIRONMENT)" in entitlements,
              "notification service target": "OshiReaderNotificationService:" in project,
              "notification content target": "OshiReaderNotificationContent:" in project,
              "Local notification extension bundles": all(value in project for value in (
                  "com.otterpia.oshireader.NotificationService",
                  "com.otterpia.oshireader.NotificationContent",
              )),
              "paid-backend notification category": "OSHI_RESULT_PREVIEW" in content_info,
              "APNs device identifier privacy declaration": "NSPrivacyCollectedDataTypeDeviceID" in privacy,
              "export compliance declaration": "ITSAppUsesNonExemptEncryption" in info,
              "Local Fastlane target": 'app_identifier: "com.otterpia.oshireader"' in fastfile,
              "environment-provided App Store credentials": "APP_STORE_CONNECT_KEY_ID" in fastfile,
              "paid backend startup guard": "if PlusStore.shouldSyncBackend" in app_delegate,
              "catalog and test guards control backend sync": all(value in plus_store for value in (
                  "isPaidPushConfigured",
                  "!isTesting",
                  'contains("--uitesting")',
              )),
              "paid backend feed client": "func fetchBackendFeed(" in backend_client,
              "backend feed entitlement guard": all(value in paid_backend for value in (
                  "PlusStore.shouldSyncBackend",
                  "hasActiveEntitlement",
              )),
              "paid hosted source health": "func fetchHostedSourceHealth(" in backend_client,
              "paid hosted item muting": "func muteHostedFeedItem(" in backend_client,
              "paid pending notification controls": all(value in backend_client for value in (
                  "func triggerPendingNotification(",
                  "func clearPendingNotification(",
              )),
              "paid APNs cleanup": "func unregisterAPNSToken(" in backend_client,
              "device-scoped paid background refresh": "func triggerBackgroundPoll(" in backend_client,
              "opt-in paid diagnostics client": all(value in paid_backend for value in (
                  'static let consentKey = "paid_backend.diagnostics_opt_in"',
                  "PaidHostedDiagnosticReporter",
              )),
              "active-paid diagnostics setting": all(value in settings_view for value in (
                  "paidDiagnosticsEnabled",
                  "plusStore.hasActiveEntitlement",
              )),
              "no client-triggered global poll": "func triggerPoll(" not in backend_client,
              "no client admin credential API": "/api/credentials" not in backend_client,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Local paid-backend configuration failed: " + ", ".join(failed))

          catalog_mode = os.environ["CATALOG_MODE"]
          product_ids = [value.strip() for value in os.environ.get("PRODUCT_IDS", "").split(",") if value.strip()]
          expected_product_ids = [product["id"] for product in catalog["products"]]
          physical = os.environ["PHYSICAL_PUSH_TEST"]
          receipt_reporting = os.environ["RECEIPT_REPORTING_TEST"]
          billing_matrix = os.environ["SANDBOX_BILLING_MATRIX"]
          paid_client_matrix = os.environ["PAID_CLIENT_MATRIX"]
          acceptance_evidence = os.environ.get("ACCEPTANCE_EVIDENCE", "").strip()
          if catalog_mode == "disabled":
              if product_ids:
                  raise SystemExit("product_ids must stay empty while the production catalog is disabled")
              if physical != "not-required":
                  raise SystemExit("physical_push_test must be not-required for a free-only candidate")
              if receipt_reporting != "not-required":
                  raise SystemExit("receipt_reporting_test must be not-required for a free-only candidate")
              if billing_matrix != "not-required":
                  raise SystemExit("sandbox_billing_matrix must be not-required for a free-only candidate")
              if paid_client_matrix != "not-required":
                  raise SystemExit("paid_client_matrix must be not-required for a free-only candidate")
              if acceptance_evidence:
                  raise SystemExit("acceptance_evidence must stay empty for a free-only candidate")
          else:
              if product_ids != expected_product_ids:
                  raise SystemExit(
                      "product_ids must exactly match the approved monthly/yearly/lifetime hosted catalog"
                  )
              if physical != "passed":
                  raise SystemExit("sandbox purchase, hosted-feed, and terminated-app push acceptance must pass")
              if receipt_reporting != "passed":
                  raise SystemExit("physical-device receipt reporting acceptance must pass")
              if billing_matrix != "passed":
                  raise SystemExit(
                      "configured-product purchase/restore, switching, lifetime coexistence/fallback, expiry, and refund/revocation acceptance must pass"
                  )
              if paid_client_matrix != "passed":
                  raise SystemExit(
                      "hosted paid-client features, recovery, lifecycle, and diagnostics acceptance must pass"
                  )
              if not acceptance_evidence:
                  raise SystemExit("a TestFlight build and dated acceptance evidence reference is required")
          print(f"Validated {catalog_mode} catalog candidate")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify paid catalog cost gate
        run: |
          python3 scripts/paid_catalog_cost_gate.py \
            --compute 1 --database 1 --egress 1 \
            --proxy 1 --apns 1 --diagnostics 1 \
            --monthly-price 100 >/dev/null
          if python3 scripts/paid_catalog_cost_gate.py \
            --compute 1 --monthly-price 1 >/dev/null; then
            echo "The paid catalog cost gate accepted an underpriced product" >&2
            exit 1
          fi
          if python3 scripts/paid_catalog_cost_gate.py \
            --compute 1 --database 1 --egress 1 \
            --proxy 1 --apns 1 --diagnostics 1 \
            --monthly-price 100 --one-time-price 100 >/dev/null; then
            echo "The paid catalog cost gate accepted an underpriced one-time product" >&2
            exit 1
          fi
          PRICE_OUTPUT=$(python3 scripts/paid_catalog_cost_gate.py \
            --compute 0.1 --database 0.1 --egress 0.1 \
            --proxy 0.1 --apns 0.1 --diagnostics 0.1 \
            --monthly-price 19.99 --one-time-price 999)
          PRICE_OUTPUT="$PRICE_OUTPUT" python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ["PRICE_OUTPUT"])
          if result["suggested_annual_price_at_ten_months"] != "199.90":
              raise SystemExit("The annual suggestion did not use the accepted monthly price")
          if result.get("one_time_price_gate_passed") is not True:
              raise SystemExit("The one-time price gate rejected a price above its floor")
          PY

      - name: Verify generated project consistency
        run: |
          xcodegen generate --spec ios-swift/project.yml
          git diff --exit-code -- ios-swift/OshiReader.xcodeproj/project.pbxproj ios-swift/OshiReader/Info.plist

      - name: Resolve simulator destination
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS")))
            | map(. + {ver: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | (.maj|tonumber)*100 + (.min|tonumber))})
            | sort_by(.ver) | reverse
            | map(.value[] | select(.name | test("^iPhone")))
            | .[0].udid
          ')
          test -n "$UDID" && test "$UDID" != "null"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test Local
        env:
          PRODUCT_IDS: ${{ inputs.product_ids }}
        run: |
          xcodebuild build \
            -project ios-swift/OshiReader.xcodeproj \
            -scheme "OshiReader Local" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            PUSH_SUBSCRIPTION_PRODUCT_IDS="$PRODUCT_IDS"
          xcodebuild test \
            -project ios-swift/OshiReader.xcodeproj \
            -scheme "OshiReader Unit Tests" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            PUSH_SUBSCRIPTION_PRODUCT_IDS="$PRODUCT_IDS"

      - name: Verify deployed backend paid-push contract
        env:
          BACKEND_URL: https://oshireader.onrender.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid
          import urllib.error
          import urllib.request

          base = os.environ["BACKEND_URL"].rstrip("/")
          with urllib.request.urlopen(f"{base}/openapi.json", timeout=30) as response:
              openapi = json.load(response)
          schemas = openapi.get("components", {}).get("schemas", {})
          entitlement = schemas.get("EntitlementStatusOut", {}).get("properties", {})
          registration = schemas.get("APNSDeviceTokenUpsert", {}).get("properties", {})
          required_entitlement = {"push_term_limit", "push_term_count", "push_delivery_state"}
          missing = required_entitlement - entitlement.keys()
          if missing:
              raise SystemExit(f"Backend entitlement contract is missing {sorted(missing)}")
          if "bundle_id" not in registration:
              raise SystemExit("Backend APNs registration lacks bundle_id")
          if "/api/entitlements/apple-notifications" not in openapi.get("paths", {}):
              raise SystemExit("Backend lacks the Apple notification lifecycle endpoint")
          paths = openapi.get("paths", {})
          required_operations = {
              "/api/source-health": {"get"},
              "/api/client-diagnostics": {"post"},
              "/api/feed/muted-items": {"post"},
              "/api/watch-terms/{term_id}/notify": {"post", "delete"},
              "/api/devices/background-refresh": {"post"},
              "/api/devices/apns-token": {"post"},
              "/api/devices/apns-token/{token}": {"delete"},
          }
          for path, methods in required_operations.items():
              available_methods = paths.get(path, {})
              missing_methods = methods - available_methods.keys()
              if missing_methods:
                  raise SystemExit(
                      f"Backend contract is missing {path} methods {sorted(missing_methods)}"
                  )

          diagnostics = schemas.get("ClientDiagnosticIn", {}).get("properties", {})
          required_diagnostic_fields = {
              "reason",
              "environment",
              "api_base",
              "app_version",
              "build",
              "active_terms_count",
              "subscribed_platforms",
              "cached_feed_count",
              "events",
          }
          missing_diagnostic_fields = required_diagnostic_fields - diagnostics.keys()
          if missing_diagnostic_fields:
              raise SystemExit(
                  f"Backend diagnostic contract is missing {sorted(missing_diagnostic_fields)}"
              )
          diagnostic_event = schemas.get("ClientDiagnosticEvent", {}).get("properties", {})
          required_event_fields = {"strategy", "status", "item_count", "added_count", "detail"}
          missing_event_fields = required_event_fields - diagnostic_event.keys()
          if missing_event_fields:
              raise SystemExit(
                  f"Backend diagnostic event contract is missing {sorted(missing_event_fields)}"
              )
          mute_request = schemas.get("FeedItemMuteIn", {}).get("properties", {})
          required_mute_fields = {"source_item_id", "watch_term_id"}
          missing_mute_fields = required_mute_fields - mute_request.keys()
          if missing_mute_fields:
              raise SystemExit(
                  f"Backend mute contract is missing {sorted(missing_mute_fields)}"
              )
          feed_operation = openapi.get("paths", {}).get("/api/feed/", {}).get("get", {})
          feed_parameters = {
              parameter.get("name")
              for parameter in feed_operation.get("parameters", [])
          }
          required_feed_parameters = {
              "term_ids",
              "since",
              "until",
              "scan",
              "scan_before_published_at",
              "scan_before_match_id",
          }
          missing_feed_parameters = required_feed_parameters - feed_parameters
          if missing_feed_parameters:
              raise SystemExit(
                  f"Backend feed snapshot contract is missing {sorted(missing_feed_parameters)}"
              )
          feed_response_headers = (
              feed_operation.get("responses", {})
              .get("200", {})
              .get("headers", {})
          )
          required_feed_headers = {
              "X-OshiReader-Next-Published-At",
              "X-OshiReader-Next-Match-ID",
          }
          missing_feed_headers = required_feed_headers - feed_response_headers.keys()
          if missing_feed_headers:
              raise SystemExit(
                  f"Backend feed continuation contract is missing {sorted(missing_feed_headers)}"
              )

          probe = urllib.request.Request(
              f"{base}/api/feed/?limit=1",
              headers={"X-Device-Secret": f"release-gate-unpaid-{uuid.uuid4()}"},
          )
          try:
              urllib.request.urlopen(probe, timeout=30)
          except urllib.error.HTTPError as error:
              body = json.load(error)
              detail = body.get("detail", {})
              if error.code != 402 or detail.get("code") != "paid_backend_required":
                  raise SystemExit(
                      f"Backend unpaid-access probe returned HTTP {error.code}: {detail}"
                  ) from error
          else:
              raise SystemExit("Backend feed accepted an unentitled device")

          try:
              urllib.request.urlopen(f"{base}/api/feed/matches/1/redirect", timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 403:
                  raise SystemExit(
                      f"Unsigned feed redirect returned HTTP {error.code}, expected 403"
                  ) from error
          else:
              raise SystemExit("Backend accepted an unsigned enumerable feed redirect")

          print("Deployed backend paid-push contract and access controls are available")
          PY
